services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        - "certs=/home/gabrielbarbosa/dev"
    container_name: pcyes-v3-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

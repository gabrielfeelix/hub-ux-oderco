<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tonante — Feita de Histórias</title>
  <link rel="icon" href="assets/logos/tonante-symbol-amber.png" />

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- phosphor icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <link rel="stylesheet" href="src/styles.css" />
  <style>
    /* ---------- responsivo ---------- */
    @media (max-width: 1080px) {
      .cat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 1024px) {
      .pdp-grid { grid-template-columns: 1fr !important; }
      .pdp-rail { position: static !important; }
      .pdp-rail > div { max-width: 460px; }
    }
    @media (max-width: 980px) {
      .catalog-split, .checkout-split, .news-grid { grid-template-columns: 1fr !important; }
      .catalog-aside { position: static !important; }
      .hero-copy, .hero-show { grid-column: 1 / -1; }
      .footer-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .promo-split, .feat-split { grid-template-columns: 1fr !important; }
      .combo-grid { grid-template-columns: 1fr !important; }
      .combo-plus { transform: rotate(90deg); margin: -4px auto; }
      .dealers-split { grid-template-columns: 1fr !important; }
      .dealers-map { position: static !important; }
      .linha-stage { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 820px) {
      .pdp-top { grid-template-columns: 1fr !important; }
      .reviews-grid { grid-template-columns: 1fr !important; }
      .desc-row { grid-template-columns: 1fr !important; }
      .desc-row > div:first-child { order: -1; }
      .desc-feat { grid-template-columns: 1fr !important; }
      .desc-tech { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 860px) {
      .nav-links { display: none !important; }
      .value-strip { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 720px) {
      .qv-card { grid-template-columns: 1fr !important; max-height: 92vh !important; }
    }
    @media (max-width: 700px) {
      .header-top { grid-template-columns: auto 1fr auto !important; gap: 14px !important; }
    }
    @media (max-width: 560px) {
      .nav-icon-hide { display: none !important; }
    }
    @media (max-width: 620px) {
      .cat-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr !important; gap: 30px !important; }
      .hero-show { display: none !important; }
      .specs-grid { grid-template-columns: 1fr !important; }
      .prod-row { grid-template-columns: 1fr !important; text-align: left; }
      .prod-row > div:last-child { align-items: flex-start !important; text-align: left !important; }
      .feat-card { grid-template-columns: 1fr !important; }
      .spec-li { grid-template-columns: 1fr !important; gap: 2px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- dados (JS puro) -->
  <script src="src/catalog_data.js"></script>
  <script src="src/data.js"></script>

  <!-- componentes (Babel) -->
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/hero.jsx"></script>
  <script type="text/babel" src="src/catalog.jsx"></script>
  <script type="text/babel" src="src/product.jsx"></script>
  <script type="text/babel" src="src/cart.jsx"></script>
  <script type="text/babel" src="src/modals.jsx"></script>
  <script type="text/babel" src="src/dealers.jsx"></script>
  <script type="text/babel" src="src/home_sections.jsx"></script>
  <script type="text/babel" src="src/home.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
